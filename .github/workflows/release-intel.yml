name: release-intel

# Build only the Intel Mac archive for an existing GitHub release. The tag can be selected
# manually after this workflow is present on the default branch.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example, v1.7.4)
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos-intel:
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Unexpected release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" >/dev/null
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Dependencies
        run: brew install cmake ninja pkgconf nasm
      - name: Cache libraries built for macOS 11
        uses: actions/cache@v6
        with:
          path: build/deps/mac
          key: mac-deps-intel-${{ hashFiles('tools/build_mac_deps.py') }}
      - name: SDL 2, Unicorn and innoextract for macOS 11
        run: python3 tools/build_mac_deps.py
      - name: Reduced FFmpeg and standalone Python
        run: |
          python3 tools/build_ffmpeg.py
          python3 tools/fetch_python.py
      - name: Configure
        run: |
          PKG_CONFIG_PATH="$PWD/build/deps/mac/lib/pkgconfig" cmake -S . -B build/diffusion -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/build/deps/mac" -DZEUS_FFMPEG=build/deps/ffmpeg \
            -DCMAKE_CXX_FLAGS=-Werror=unguarded-availability-new
      - name: Build and package Intel Mac application
        run: python3 tools/publish.py release "$VERSION"
      - name: Attach Intel archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "build/diffusion/Zeus-Poseidon-$VERSION-macos-intel.zip" \
            build/diffusion/Zeus-Poseidon-macos-intel.zip \
            --clobber
